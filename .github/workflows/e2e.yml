# E2E tests run on PRs, pushes to main, nightly at 04:00 (VN time) and manual dispatch.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 04:00 VN
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # required to push the Allure report to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx playwright test
        env:
          E2E_BASE_URL: https://mentor-dev.teencare.co
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload report (HTML + trace)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # --- Allure report → GitHub Pages (main branch runs only) ---

      - name: Checkout gh-pages for Allure history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v4
        continue-on-error: true # gh-pages does not exist on the very first run
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure trend history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi

      - name: Generate Allure report
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: npx allure generate allure-results -o allure-report --clean

      - name: Deploy Allure report to GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
